<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Олимпийский исследовательский портал</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Подключаем Chart.js для графиков -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <!-- Шапка сайта -->
    <header class="site-header">
        <div class="header-content">
            <div class="logo-area">
                <span class="logo-icon">📖</span>
                <h1>Олимпийский исследовательский портал</h1>
            </div>
            <div class="database-counter" id="db-counter">
                Исследований в базе: <span id="header-stat-count">...</span>
            </div>
        </div>
    </header>

    <!-- Основной контейнер -->
    <main class="main-container">
        
        <!-- Лента исследований -->
        <section class="feed-section" id="publications-feed">
            <!-- Сюда динамически подгружаются карточки -->
        </section>

        <!-- Правая колонка: Аналитика и статистика -->
        <aside class="analytics-sidebar">
            <div class="analytics-card">
                <h3>АНАЛИТИКА ВЫБОРКИ</h3>
                
                <div class="chart-container">
                    <h4>Направления олимпизма</h4>
                    <canvas id="donutChart"></canvas>
                </div>

                <div class="chart-container" style="margin-top: 25px;">
                    <h4>Динамика по годам</h4>
                    <canvas id="lineChart"></canvas>
                </div>
            </div>
        </aside>

    </main>

    <!-- Модальное окно просмотра аннотации -->
    <div id="modal-view" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <button class="modal-close" id="modal-close">✕</button>
            <h2 id="modal-title">Название исследования</h2>
            <p class="modal-meta"><span id="modal-authors">Авторы</span> (<span id="modal-year">2026</span>)</p>
            <p style="font-size: 12px; color: #666; margin-bottom: 10px;">
                Направление: <strong id="modal-discipline">-</strong> | Тип: <strong id="modal-doctype">-</strong> | Страна: <strong id="modal-country">-</strong>
            </p>
            <div class="modal-body">
                <h4>📌 Аннотация:</h4>
                <p id="modal-abstract">Текст аннотации...</p>
                <h4 style="margin-top: 15px;">📋 ГОСТ Р 7.0.100–2018:</h4>
                <p id="modal-citation" style="font-style: italic; background: #f8f9fa; padding: 8px; border-radius: 4px; font-size: 11px;"></p>
            </div>
            <div class="modal-footer">
                <a id="modal-original-link" href="#" target="_blank" class="btn-primary">Оригинал публикации ↗</a>
            </div>
        </div>
    </div>

    <!-- Подключаем скрипт логики сайта -->
    <script src="app.js"></script>
</body>
</html>
