<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PORTALIS OLYMPICA | Академический портал исследований олимпизма</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ВЕРХНЯЯ НАВИГАЦИОННАЯ ПАНЕЛЬ -->
  <header class="site-header">
    <div class="header-container">
      <div class="brand-block">
        <svg class="brand-logo-svg" viewBox="0 0 48 48">
          <path d="M8 38V12C8 9.79 9.79 8 12 8H24V40H12C9.79 40 8 38.21 8 38Z" />
          <path d="M40 38V12C40 9.79 38.21 8 36 8H24V40H36C38.21 40 40 38.21 40 38Z" />
          <path d="M12 16H20 M12 22H20 M12 28H18 M28 16H36 M28 22H36 M28 28H34" />
          <path d="M18 8C18 4.68 20.68 2 24 2C27.32 2 30 4.68 30 8" />
        </svg>
        <div class="brand-titles">
          <h1 class="portal-title">PORTALIS OLYMPICA</h1>
          <span class="portal-subtitle">Европейский архив научных исследований олимпизма</span>
        </div>
      </div>

      <div class="header-stats">
        <div class="stat-item">
          Всего публикаций: <strong id="stat-total">1,639</strong>
        </div>
        <div class="stat-item">
          Дисциплин: <strong>10</strong>
        </div>
        <div class="stat-item">
          Статус: <strong>Рецензировано</strong>
        </div>
      </div>
    </div>
  </header>

  <!-- ОСНОВНОЙ КОНТЕНТ С ФИЛЬТРАМИ -->
  <div class="layout-wrapper">
    
    <!-- ЛЕВАЯ ПАНЕЛЬ ФИЛЬТРАЦИИ И ПОИСКА -->
    <aside class="sidebar-panel">
      <h2 class="sidebar-title">
        Поиск и Навигация
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#B38A4B" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </h2>

      <!-- Поисковая строка -->
      <div class="filter-group">
        <label class="filter-label" for="search-input">Ключевое слово или заглавие</label>
        <div class="search-input-wrapper">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="search-input" class="search-input" placeholder="Введите название или ключевое слово...">
        </div>
      </div>

      <!-- Рубрикатор по 10 олимпийским дисциплинам -->
      <div class="filter-group">
        <label class="filter-label">Научные дисциплины (10)</label>
        <ul class="category-list" id="category-list">
          <li class="category-item">
            <button class="active" data-category="ALL">
              <span>Все направления</span>
              <span class="category-count" id="count-all">1639</span>
            </button>
          </li>
        </ul>
      </div>
    </aside>

    <!-- ОСНОВНАЯ ЛЕНТА ПУБЛИКАЦИЙ -->
    <main class="main-content">
      
      <!-- Панель управления лентой -->
      <div class="toolbar-panel">
        <div class="results-count">
          Найдено публикаций: <strong id="current-count">1639</strong>
        </div>
        <div style="display: flex; align-items: center; gap: 0.5rem;">
          <label for="sort-select" style="font-size: 0.82rem; color: var(--text-muted);">Сортировка:</label>
          <select id="sort-select" class="sort-select">
            <option value="default">По умолчанию</option>
            <option value="title">По заглавию (А-Я / A-Z)</option>
          </select>
        </div>
      </div>

      <!-- Контейнер карточек -->
      <div id="publications-feed">
        <!-- Карточки загружаются автоматически через JS -->
      </div>

    </main>
  </div>

  <!-- МОДАЛЬНОЕ ОКНО ДЕТАЛЬНОГО ПРОСМОТРА И ЦИТИРОВАНИЯ -->
  <div class="modal-backdrop" id="modal-view">
    <div class="modal-content">
      <button class="modal-close-btn" id="modal-close">&times;</button>
      <span class="discipline-tag" id="modal-discipline">Дисциплина</span>
      <h2 class="modal-title" id="modal-title">Название научной работы</h2>
      
      <div class="modal-abstract-full" id="modal-abstract">
        Полный текст аннотации...
      </div>

      <h4 style="font-family: var(--font-serif); color: var(--primary-navy); margin-bottom: 0.5rem;">Цитирование (ГОСТ Р 7.0.100–2018)</h4>
      <div class="citation-box" id="modal-citation">
        Загрузка цитаты...
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
